services:
  - type: web
    name: jping
    plan: free
    runtime: image
    image:
      url: docker.io/tanin47/jping:v1.2.0
    healthCheckPath: /healthcheck
    envVars:
      - key: JPING_PORT
        value: 9090
      - key: JPING_DATABASE_URL
        sync: false
      - key: JPING_USERNAME
        sync: false
      - key: JPING_PASSWORD
        sync: false
      - key: JPING_PUBLIC_ACCESS
        sync: false
    autoDeploy: true
